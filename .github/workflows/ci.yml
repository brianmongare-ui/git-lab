name: CI

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Greeting
        run: echo "Pushed by ${{ github.actor }} from the Ubuntu VM"
